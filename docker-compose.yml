services:
  api:
    build: .
    container_name: library_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/library.db
      - SECRET_KEY=super_secret_key_in_docker
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./uploads:/app/uploads
      - sqlite_data:/app/data
    restart: always

volumes:
  sqlite_data: